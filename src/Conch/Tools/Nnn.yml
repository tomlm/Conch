id: nnn
name: nnn
version: 1.0.0
author: Arun Prakash Jana
description: Tiny, fast, nearly zero-config terminal file manager with disk usage analysis, batch rename and plugins
license: BSD-2-Clause
platforms:
  linux:
    install: sudo apt-get update && sudo apt-get install -y nnn
    uninstall: sudo apt-get remove -y nnn
command: nnn
args: "%1?"
source: https://github.com/jarun/nnn
website: https://github.com/jarun/nnn
documentation: https://github.com/jarun/nnn#readme
screenshot: https://github.com/user-attachments/assets/a8ee4689-1552-4fb1-997e-b16fe8ef5086
keywords:
  - tui
  - file manager
  - terminal

roles:
  - file-explorer
