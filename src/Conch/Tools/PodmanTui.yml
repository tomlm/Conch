id: podman.tui
name: podman-tui
version: 1.0.0
author: Containers
description: Terminal UI for managing Podman containers, pods, images, volumes and networks on a local or remote machine
license: Apache-2.0
platforms:
  # Not in Debian. podman-tui 2.x only talks to Podman 6, and Debian 13 ships Podman 5, so this
  # pins the last 1.x release (x86_64 only; upstream has no arm64 build of 1.x), checked by
  # hash. Podman comes from apt alongside it; podman-tui connects to the podman.socket service.
  linux:
    install: >-
      sudo apt-get update && sudo apt-get install -y wget unzip podman &&
      t=$(mktemp -d) && cd "$t" &&
      case "$(uname -m)" in
      x86_64) a=https://github.com/containers/podman-tui/releases/download/v1.11.3/podman-tui-release-linux_amd64.zip; s=7fc071e1086520ad9beb46349c0a7e92b0039679160592f6af54fc717c1231ec ;;
      *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
      esac &&
      wget -q -O pkg "$a" && echo "$s  pkg" | sha256sum -c --quiet &&
      unzip -q pkg && sudo install -m 755 podman-tui-release-linux_amd64/podman-tui-1.11.3/podman-tui /usr/local/bin/podman-tui &&
      cd / && rm -rf "$t"
    # podman stays: other programs use it, and apt owns it.
    uninstall: sudo rm -f /usr/local/bin/podman-tui
command: podman-tui
args: ""
source: https://github.com/containers/podman-tui
website: https://github.com/containers/podman-tui
documentation: https://github.com/containers/podman-tui#readme
screenshot: https://raw.githubusercontent.com/containers/podman-tui/e1658cc5613de13af22203a479daf05cdff0fd9a/docs/podman-tui.gif
keywords:
  - tui
  - podman
  - containers
  - pods

roles: []
