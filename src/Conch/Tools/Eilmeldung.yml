id: eilmeldung
name: eilmeldung
version: 1.0.0
author: Christopher Auer
description: RSS reader that supports many feed providers, bulk operations and extensive configuration
license: GPL-3.0
platforms:
  linux:
    install: >-
      sudo apt-get update && sudo apt-get install -y wget &&
      t=$(mktemp -d) && cd "$t" &&
      case "$(uname -m)" in
      x86_64) a=https://github.com/christo-auer/eilmeldung/releases/download/1.9.0/eilmeldung-x86_64-unknown-linux-musl-1.9.0.tar.gz; s=03088b672c8195aebe32dfc8646f5e1e14096e64ad28e223cf5ae717085e7cf7 ;;
      aarch64) a=https://github.com/christo-auer/eilmeldung/releases/download/1.9.0/eilmeldung-aarch64-unknown-linux-musl-1.9.0.tar.gz; s=65532eaa2d17b1ff65d4a521c363920cdb3e11625f530073eb597a72fc8d6dad ;;
      *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
      esac &&
      wget -q -O pkg "$a" && echo "$s  pkg" | sha256sum -c --quiet &&
      tar -xzf pkg && sudo install -m 755 eilmeldung/eilmeldung /usr/local/bin/eilmeldung &&
      cd / && rm -rf "$t"
    uninstall: sudo rm -f /usr/local/bin/eilmeldung
command: eilmeldung
args: ""
source: https://github.com/christo-auer/eilmeldung
website: https://github.com/christo-auer/eilmeldung
documentation: https://github.com/christo-auer/eilmeldung#readme
screenshot: https://raw.githubusercontent.com/christo-auer/eilmeldung/e2c611e516513fd5e2919fa84789cb86cd700550/docs/images/hero-shot.png
keywords:
  - rss
  - feeds
  - news
  - tui

roles: []
