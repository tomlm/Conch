id: jiratui
name: JiraTUI
version: 1.0.0
author: Gaston T.
description: Jira client for the terminal that searches, views, creates and updates issues
license: MIT
platforms:
  linux:
    install: sudo apt-get update && sudo apt-get install -y pipx && sudo pipx install --global jiratui
    uninstall: sudo pipx uninstall --global jiratui
command: jiratui
args: "ui"
source: https://github.com/whyisdifficult/jiratui
website: https://jiratui.sh/
documentation: https://jiratui.sh/
screenshot: https://whyisdifficult.github.io/jiratui/assets/img/gallery/screenshot-jiratui-home.png
keywords:
  - jira
  - issues
  - project management
  - tui
  - textual

roles: []
