id: zellij
name: Zellij
version: 1.0.0
author: Zellij contributors
description: Terminal workspace and multiplexer with automatic layouts, floating panes and plugins
license: MIT
platforms:
  linux:
    install: >-
      sudo apt-get update && sudo apt-get install -y wget &&
      t=$(mktemp -d) && cd "$t" &&
      case "$(uname -m)" in
      x86_64) a=https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-x86_64-unknown-linux-musl.tar.gz; s=40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc ;;
      aarch64) a=https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-aarch64-unknown-linux-musl.tar.gz; s=05f0802afadd53f8db9514e7cae53c9ae8432fed1b35b8294aa816ee3044a16b ;;
      *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
      esac &&
      wget -q -O pkg "$a" && echo "$s  pkg" | sha256sum -c --quiet &&
      tar -xzf pkg && sudo install -m 755 zellij /usr/local/bin/zellij &&
      cd / && rm -rf "$t"
    uninstall: sudo rm -f /usr/local/bin/zellij
  # The MSI adds its folder to the PATH; a process started before the install will not see it.
  windows:
    install: winget install -e --id Zellij.Zellij
    uninstall: winget uninstall -e --id Zellij.Zellij
command: zellij
args: ""
source: https://github.com/zellij-org/zellij
website: https://zellij.dev/
documentation: https://zellij.dev/documentation/
screenshot: https://zellij.dev/img/zellij-floating-panes.png
keywords:
  - tui
  - multiplexer
  - workspace
  - terminal

roles: []
