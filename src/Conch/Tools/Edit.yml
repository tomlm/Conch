id: edit.exe
name: Edit
version: 1.0.0
author: Microsoft
description: Simple text editor for the terminal, in the spirit of MS-DOS Edit, with mouse support
license: MIT
platforms:
  windows:
    install: winget install -e --id Microsoft.Edit
    uninstall: winget uninstall -e --id Microsoft.Edit
command: edit
args: "%1?"
source: https://github.com/microsoft/edit
website: https://github.com/microsoft/edit
documentation: https://github.com/microsoft/edit
keywords:
  - text editor
  - terminal
  - mouse

roles:
  - text-editor
