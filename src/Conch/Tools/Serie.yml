id: serie
name: Serie
version: 1.0.0
author: Kyosuke Fujimoto
description: Git commit graph viewer that draws the history of the current repository in the terminal
license: MIT
platforms:
  linux:
    install: >-
      sudo apt-get update && sudo apt-get install -y wget git &&
      t=$(mktemp -d) && cd "$t" &&
      case "$(uname -m)" in
      x86_64) a=https://github.com/lusingander/serie/releases/download/v0.9.2/serie-0.9.2-x86_64-unknown-linux-musl.tar.gz; s=0a1e6753f00a4f7d76f820bf9d7caa1ccc97049645d6f901478d3af2653fc74e ;;
      aarch64) a=https://github.com/lusingander/serie/releases/download/v0.9.2/serie-0.9.2-aarch64-unknown-linux-musl.tar.gz; s=be752b053dcbdef46f3e5c5d41c4615577c1960d37ef4a639d227f1298ba6b1b ;;
      *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
      esac &&
      wget -q -O pkg "$a" && echo "$s  pkg" | sha256sum -c --quiet &&
      tar -xzf pkg && sudo install -m 755 serie /usr/local/bin/serie &&
      cd / && rm -rf "$t"
    uninstall: sudo rm -f /usr/local/bin/serie
command: serie
args: ""
source: https://github.com/lusingander/serie
website: https://lusingander.github.io/serie/
documentation: https://lusingander.github.io/serie/
screenshot: https://raw.githubusercontent.com/lusingander/serie/4ac4539f802ab1cede9356b02a8e6ca450b604b9/img/demo.gif
keywords:
  - git
  - graph
  - history
  - commits
  - tui

roles: []
