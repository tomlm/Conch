id: edit.net
name: Edit.NET
version: 1.0.0
author: Tom Laird-McConnell & Evgeny Gorbovoy
description: Full text editor with TextMate themes
license: MIT
platforms:
  default:
    install: dotnet tool install -g editdotnet --prerelease
    uninstall: dotnet tool uninstall -g editdotnet
command: edit.net
args: "%1? %2? %3? %4? %5?"
source: https://github.com/consolonia/Edit.NET
website: https://github.com/consolonia/Edit.NET
documentation: https://github.com/consolonia/Edit.Net/wiki
keywords:
  - text editor
  - code editor
  - textmate themes
  - syntax highlighting

roles:
  - text-editor

requires:
  - dotnet.10
