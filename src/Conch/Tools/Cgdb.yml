id: cgdb
name: cgdb
version: 1.0.0
author: CGDB Team
description: Curses interface to the GNU Debugger that shows source code alongside the GDB session
license: GPL-2.0
platforms:
  linux:
    install: sudo apt-get update && sudo apt-get install -y cgdb
    uninstall: sudo apt-get remove -y cgdb
command: cgdb
args: "%1?"
source: https://github.com/cgdb/cgdb
website: https://cgdb.github.io/
documentation: https://cgdb.github.io/docs/cgdb.html
screenshot: https://cdn.terminaltrove.com/m/f50fd4fe-77de-480c-9e98-40964e8523e6.png
keywords:
  - debugger
  - gdb
  - debugging
  - development
  - tui

roles: []
