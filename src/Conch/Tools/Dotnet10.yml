id: dotnet.10
name: .NET 10 SDK
version: 1.0.0
author: Microsoft
description: Runtime and tooling for .NET 10 apps
license: MIT
platforms:
  linux:
    install: wget -q https://packages.microsoft.com/config/debian/13/packages-microsoft-prod.deb -O /tmp/packages-microsoft-prod.deb && sudo dpkg -i /tmp/packages-microsoft-prod.deb && rm -f /tmp/packages-microsoft-prod.deb && sudo apt-get update && sudo apt-get install -y dotnet-sdk-10.0
    uninstall: sudo apt-get remove -y dotnet-sdk-10.0
    detect: dotnet --list-sdks 2>/dev/null | grep -q "^10\."
  windows:
    install: winget install --id Microsoft.DotNet.SDK.10 -e --accept-source-agreements --accept-package-agreements
    uninstall: winget uninstall --id Microsoft.DotNet.SDK.10 -e
    detect: dotnet --list-sdks 2>NUL | findstr /b "10."
command: dotnet
args: ""
source: https://github.com/dotnet/sdk
website: https://dotnet.microsoft.com/
documentation: https://learn.microsoft.com/dotnet/core/install/linux-debian
keywords:
  - dotnet
  - sdk
  - runtime
  - toolchain

roles: []
