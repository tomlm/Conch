id: neovim
name: Neovim
version: 1.0.0
author: Neovim contributors
description: Hyperextensible Vim-based text editor
license: Apache-2.0 AND Vim
platforms:
  linux:
    install: sudo apt-get update && sudo apt-get install -y neovim
    uninstall: sudo apt-get remove -y neovim
  # The MSI adds its bin folder to the PATH; a process started before the install will not see it.
  windows:
    install: winget install -e --id Neovim.Neovim
    uninstall: winget uninstall -e --id Neovim.Neovim
command: nvim
args: "%1?"
source: https://github.com/neovim/neovim
website: https://neovim.io/
documentation: https://neovim.io/doc/
screenshot: https://cdn.terminaltrove.com/m/fe68c42c-c1f8-4338-a1b2-9cae60996b75.png
keywords:
  - text editor
  - code editor
  - vim
  - modal
  - terminal

roles:
  - text-editor
