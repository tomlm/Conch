id: conchix.display
name: Conchix Display
version: 1.0.0
author: Conchix
description: Console font, font size and resolution for Conchix's kmscon console
license: MIT
platforms:
  # Part of the Conchix image, not something to install: it edits /etc/kmscon/kmscon.conf,
  # which only exists where kmscon draws the console. Elsewhere it is simply not
  # installed, and Tools > Display says nothing serves the role.
  linux:
    install: echo "Conchix Display comes with the Conchix image; it edits kmscon's settings and has nothing to configure elsewhere." && exit 1
    uninstall: echo "Conchix Display is part of the Conchix image, so Conch does not remove it." && exit 1
    detect: test -x /usr/bin/conchix-display
command: conchix-display
args: ""
source: https://github.com/tomlm/Conchix
website: https://github.com/tomlm/Conchix
documentation: https://github.com/tomlm/Conchix#readme
keywords:
  - display
  - font
  - resolution
  - kmscon
  - console

roles:
  - display-config
