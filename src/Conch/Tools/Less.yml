id: less
name: less
version: 1.0.0
author: Mark Nudelman et al.
description: Terminal pager program for viewing text one screen at a time
license: GPL-3.0
platforms:
  linux:
    install: sudo apt-get update && sudo apt-get install -y less
    # Not removed from here: Debian installs less by default, and man, git and others use it
    # as their pager.
    uninstall: echo "less is the system pager on Debian (man and git use it), so Conch does not remove it." && exit 1
  windows:
    install: winget install -e --id jftuga.less
    uninstall: winget uninstall -e --id jftuga.less
command: less
args: "%1?"
source: https://www.greenwoodsoftware.com/less/
website: https://www.greenwoodsoftware.com/less/
documentation: https://www.greenwoodsoftware.com/less/
keywords:
  - pager
  - terminal
  - less
