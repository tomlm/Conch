website: https://anufrievroman.gitbook.io/calcure
documentation: https://anufrievroman.gitbook.io/calcure
screenshot: https://raw.githubusercontent.com/anufrievroman/calcure/c529fe27c5901c219576a7a51464947d30150b87/screenshot.png
keywords:
  - calendar
  - tasks
  - todo
  - productivity
  - tui

roles: []
