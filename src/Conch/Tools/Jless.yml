id: jless
name: jless
version: 1.0.0
author: Paul Julius Martinez
description: JSON viewer with vim-like navigation, collapsible nodes and search
license: MIT
platforms:
  # Not in Debian. Pinned upstream release, checked by hash. Upstream publishes a Linux build
  # for x86_64 only, linked against the xcb libraries it uses for the clipboard.
  linux:
    install: >-
      sudo apt-get update && sudo apt-get install -y wget unzip libxcb1 libxcb-render0 libxcb-shape0 libxcb-xfixes0 &&
      t=$(mktemp -d) && cd "$t" &&
      case "$(uname -m)" in
      x86_64) a=https://github.com/PaulJuliusMartinez/jless/releases/download/v0.9.0/jless-v0.9.0-x86_64-unknown-linux-gnu.zip; s=a1e0eb63ef347adc649989ac5c7d2dc896df6d494622b953c86e3a248e733a93 ;;
      *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
      esac &&
      wget -q -O pkg "$a" && echo "$s  pkg" | sha256sum -c --quiet &&
      unzip -q pkg && sudo install -m 755 jless /usr/local/bin/jless &&
      cd / && rm -rf "$t"
    uninstall: sudo rm -f /usr/local/bin/jless
command: jless
args: "%1"
source: https://github.com/PaulJuliusMartinez/jless
website: https://jless.io/
documentation: https://jless.io/user-guide
screenshot: https://cdn.terminaltrove.com/m/b6af7e23-c35a-4d9e-bc9a-4a8e7aaf5eea.png
keywords:
  - json
  - yaml
  - viewer
  - pager
  - tui

roles: []

opens:
  - .json
