id: atop
name: atop
version: 1.0.0
author: Gerlof Langeveld
description: System and process monitor that shows the load on processor, memory, disks and network and logs it for later analysis
license: GPL-2.0
platforms:
  linux:
    install: sudo apt-get update && sudo apt-get install -y atop
    uninstall: sudo apt-get remove -y atop
command: atop
args: ""
source: https://github.com/Atoptool/atop
website: https://www.atoptool.nl/
documentation: https://www.atoptool.nl/
keywords:
  - monitor
  - processes
  - cpu
  - memory
  - tui

roles:
  - system-monitor
