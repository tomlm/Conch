id: rainfrog
name: rainfrog
version: 1.0.0
author: Carl Liu
description: Database management tool for PostgreSQL, MySQL and SQLite with a query editor and vim-like keys
license: MIT
platforms:
  # Not in Debian. Pinned upstream release, checked by hash.
  linux:
    install: >-
      sudo apt-get update && sudo apt-get install -y wget &&
      t=$(mktemp -d) && cd "$t" &&
      case "$(uname -m)" in
      x86_64) a=https://github.com/achristmascarl/rainfrog/releases/download/v0.4.6/rainfrog-v0.4.6-x86_64-unknown-linux-musl.tar.gz; s=973341d39cb1e04359886670d08632b5bd876de220c7a4759889498b22482887 ;;
      aarch64) a=https://github.com/achristmascarl/rainfrog/releases/download/v0.4.6/rainfrog-v0.4.6-aarch64-unknown-linux-musl.tar.gz; s=919ba9e2ddcda6ace07066967e375b7b091ba0a69b67b5a8135efdea3643b507 ;;
      *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
      esac &&
      wget -q -O pkg "$a" && echo "$s  pkg" | sha256sum -c --quiet &&
      tar -xzf pkg && sudo install -m 755 rainfrog /usr/local/bin/rainfrog &&
      cd / && rm -rf "$t"
    uninstall: sudo rm -f /usr/local/bin/rainfrog
command: rainfrog
args: ""
source: https://github.com/achristmascarl/rainfrog
website: https://github.com/achristmascarl/rainfrog
documentation: https://github.com/achristmascarl/rainfrog#readme
screenshot: https://raw.githubusercontent.com/achristmascarl/rainfrog/771fa61b86bc9a4838c952d729ba79319a556f33/vhs/demo.gif
keywords:
  - database
  - sql
  - postgres
  - mysql
  - sqlite
  - tui

roles: []
