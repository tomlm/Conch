id: ttyper
name: ttyper
version: 1.0.0
author: Max Niederman
description: Typing test for the terminal with word lists in several languages and code
license: MIT
platforms:
  linux:
    install: >-
      sudo apt-get update && sudo apt-get install -y wget &&
      t=$(mktemp -d) && cd "$t" &&
      case "$(uname -m)" in
      x86_64) a=https://github.com/max-niederman/ttyper/releases/download/v1.6.0/ttyper-x86_64-unknown-linux-musl.tar.gz; s=0697132e20c64e5b764b2133f205aba17aea2580935892a2037a0fae875eac90 ;;
      aarch64) a=https://github.com/max-niederman/ttyper/releases/download/v1.6.0/ttyper-aarch64-unknown-linux-musl.tar.gz; s=23f2f0282e2e4cbcf22834094c7488a218f781896192ac13878e49ee4434fbe1 ;;
      *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
      esac &&
      wget -q -O pkg "$a" && echo "$s  pkg" | sha256sum -c --quiet &&
      tar -xzf pkg && sudo install -m 755 ttyper /usr/local/bin/ttyper &&
      cd / && rm -rf "$t"
    uninstall: sudo rm -f /usr/local/bin/ttyper
command: ttyper
args: ""
source: https://github.com/max-niederman/ttyper
website: https://github.com/max-niederman/ttyper
documentation: https://github.com/max-niederman/ttyper#readme
screenshot: https://raw.githubusercontent.com/max-niederman/ttyper/e218bad9d5c546ff31c1b2a141a42c2eebf50d23/resources/recording.gif
keywords:
  - typing
  - test
  - practice
  - tui

roles: []
