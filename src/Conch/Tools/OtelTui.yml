id: otel.tui
name: otel-tui
version: 1.0.0
author: Y.Matsuda
description: OpenTelemetry viewer that receives traces, metrics and logs over OTLP and shows them in the terminal
license: Apache-2.0
platforms:
  linux:
    install: >-
      sudo apt-get update && sudo apt-get install -y wget &&
      t=$(mktemp -d) && cd "$t" &&
      case "$(uname -m)" in
      x86_64) a=https://github.com/ymtdzzz/otel-tui/releases/download/v0.7.5/otel-tui_Linux_x86_64.tar.gz; s=dd10bfa12b6713a2d51d7a094644ff61a2467856fc93d3acecfe741a124ca896 ;;
      aarch64) a=https://github.com/ymtdzzz/otel-tui/releases/download/v0.7.5/otel-tui_Linux_arm64.tar.gz; s=b627a7bbf5d6be7aed1fdd36e6cee935edd590b5be4cb9b124bd0450dd75bb63 ;;
      *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
      esac &&
      wget -q -O pkg "$a" && echo "$s  pkg" | sha256sum -c --quiet &&
      tar -xzf pkg && sudo install -m 755 otel-tui /usr/local/bin/otel-tui &&
      cd / && rm -rf "$t"
    uninstall: sudo rm -f /usr/local/bin/otel-tui
command: otel-tui
args: ""
source: https://github.com/ymtdzzz/otel-tui
website: https://github.com/ymtdzzz/otel-tui
documentation: https://github.com/ymtdzzz/otel-tui#readme
screenshot: https://raw.githubusercontent.com/ymtdzzz/otel-tui/253c5e35ab39d1472955eaeb0304c3cf501dbf7c/docs/traces.png
keywords:
  - opentelemetry
  - tracing
  - observability
  - tui

roles: []
