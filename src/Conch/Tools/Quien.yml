id: quien
name: quien
version: 1.0.0
author: Ben Word
description: WHOIS and domain lookup tool with tabbed views for registration, DNS, mail authentication, TLS, HTTP headers, SEO and tech stack
license: MIT
platforms:
  # Not in Debian. Pinned upstream release, checked by hash; static Go binary. Run without a
  # domain, it prompts for one.
  linux:
    install: >-
      sudo apt-get update && sudo apt-get install -y wget &&
      t=$(mktemp -d) && cd "$t" &&
      case "$(uname -m)" in
      x86_64) a=https://github.com/retlehs/quien/releases/download/v0.12.0/quien_linux_amd64.tar.gz; s=2aae42e8610374ee57e47939be65bf7e16f146145a402708e7f1b5db268fed83 ;;
      aarch64) a=https://github.com/retlehs/quien/releases/download/v0.12.0/quien_linux_arm64.tar.gz; s=a426b0511326078e1a246d9c439f7b8caf5d8f3e0d70a3d014ef70e5992655c0 ;;
      *) echo "unsupported architecture $(uname -m)"; exit 1 ;;
      esac &&
      wget -q -O pkg "$a" && echo "$s  pkg" | sha256sum -c --quiet &&
      tar -xzf pkg && sudo install -m 755 quien /usr/local/bin/quien &&
      cd / && rm -rf "$t"
    uninstall: sudo rm -f /usr/local/bin/quien
command: quien
args: ""
source: https://github.com/retlehs/quien
website: https://github.com/retlehs/quien
documentation: https://github.com/retlehs/quien#readme
screenshot: https://raw.githubusercontent.com/retlehs/quien/f94d51559476f92b543a562e8c8aa25b9abe345c/demo.gif
keywords:
  - tui
  - whois
  - dns
  - domains
  - network

roles: []
