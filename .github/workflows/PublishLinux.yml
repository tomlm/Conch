name: PublishLinux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (x.y.z)"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
          - arch: arm64
            rid: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building conch $VERSION (${{ matrix.arch }})"

      - name: Publish self-contained
        run: |
          dotnet publish src/Conch/Conch.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.version }} \
            -o publish/${{ matrix.arch }} \
            --nologo

      - name: Verify the seed catalog shipped
        run: |
          # The catalog is the app's whole point; a publish without it produces a
          # package that installs an empty shell.
          test -x publish/${{ matrix.arch }}/Conch
          COUNT=$(ls publish/${{ matrix.arch }}/Tools/*.yml | wc -l)
          echo "seed catalog: $COUNT registrations"
          test "$COUNT" -gt 0

      - name: Build .deb
        run: |
          ./packaging/build-deb.sh \
            --version ${{ steps.version.outputs.version }} \
            --arch ${{ matrix.arch }} \
            --publish-dir publish/${{ matrix.arch }} \
            --out dist

      - name: Inspect package
        run: |
          DEB=dist/conch_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb
          dpkg-deb -I "$DEB"
          echo "--- payload entries ---"
          dpkg-deb -c "$DEB" | wc -l

      - name: Lint package
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lintian
          lintian --no-tag-display-limit \
            dist/conch_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb || true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: conch-${{ steps.version.outputs.version }}-${{ matrix.arch }}-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload tarball
        run: tar -C publish/${{ matrix.arch }} -czf dist/conch-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz .

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: conch-${{ steps.version.outputs.version }}-${{ matrix.rid }}-tarball
          path: dist/*.tar.gz
          if-no-files-found: error
